[package]
name = "trickiness-app"
description = "Desktop GUI: draw rate and per-side trickiness for chess games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "trickiness-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
trickiness-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.11"
shakmaty = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "http2", "charset", "system-proxy"] }
