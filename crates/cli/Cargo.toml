[package]
name = "trickiness-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "trickiness"
path = "src/main.rs"

[dependencies]
trickiness-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
shakmaty = "0.30"
